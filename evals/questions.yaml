# 20 question/answer pairs over data/corpus/ (22 documents).
#
# `source`  — the document that must appear in the retrieved set (gold label for
#             hit-rate and MRR).
# `answer_keywords` — strings a correct answer must contain. Deliberately numbers
#             and proper nouns, not prose, so the check is objective.
# `kind`    — `lexical` quotes the document's own wording (BM25 should win these);
#             `semantic` paraphrases (dense should win); `twin` has a near-duplicate
#             document in the corpus that answers the same question differently, so
#             retrieving the wrong one of the pair is a plausible, scored failure.
#
# The twin pairs are the point of this set. 02-deployment/13-mobile-release-policy,
# 03-oncall/14-incident-comms, 05-data-retention/16-warehouse-retention,
# 07-security-policy/15-contractor-access, 11-api-guidelines/17-sdk-versioning,
# 12-hiring/18-interviewer-guide, 10-ml-platform/19-experiment-tracking,
# 06-architecture/20-clickhouse-tuning.

