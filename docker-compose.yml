# api + qdrant + postgres(pgvector).
#
# The api talks to the Qdrant *server* here (QDRANT_URL set), unlike the local
# default which uses embedded mode. Both paths are exercised: compose is the
# production shape, embedded is the `git clone && make evals` shape.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: documents
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      POSTGRES_DSN: postgresql://rag:rag@postgres:5432/rag
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBED_DIM: ${EMBED_DIM:-384}
      CHUNK_TOKENS: ${CHUNK_TOKENS:-512}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-64}
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANSWER_MODEL: ${ANSWER_MODEL:-gpt-4o-mini}
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  qdrant_data:
  pg_data:
